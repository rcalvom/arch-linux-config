[terminal]
vt = 1

[default_session]
command = "tuigreet --time --time-format '%A, %B %d, %Y - %I:%M %p' --greeting 'Sign in to your session' --theme 'border=blue;text=white;prompt=green;time=white;action=white;button=blue;container=black;input=white;greet=lightcyan;title=lightcyan' --width 60 --window-padding 2 --container-padding 2 --prompt-padding 1 --greet-align center --remember --remember-session --asterisks --sessions /usr/share/wayland-sessions --xsessions /usr/share/xsessions --session-wrapper /usr/local/libexec/archcfg-wayland-session-wrapper --xsession-wrapper /usr/local/libexec/archcfg-xsession-wrapper --cmd Hyprland"
user = "greeter"
