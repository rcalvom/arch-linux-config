# Graphical lock screen matching GRUB and greetd. Preserves the existing session.

$font = UbuntuMono Nerd Font
$border = rgb(033e8c)
$accent = rgb(4fb8cc)
$text = rgb(f1f1f1)
$muted = rgb(b8c4cc)
$green = rgb(10a778)

general {
    hide_cursor = true
    fail_timeout = 4000
}

auth {
    # Preserve true when adopting on an already configured fingerprint host.
    fingerprint {
        enabled = false
        ready_message = Scan fingerprint to unlock
        present_message = Scanning fingerprint...
        retry_delay = 250
    }
}

animations {
    enabled = false
}

background {
    monitor =
    path = $HOME/Pictures/wallpaper2.png
    color = rgb(000000)
    blur_passes = 0
    zindex = -2
}

shape {
    monitor =
    size = 94%, 94%
    color = rgba(000000cc)
    border_size = 2
    border_color = $border
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = -1
}

input-field {
    monitor =
    size = 460, 48
    outline_thickness = 2
    inner_color = rgb(000000)
    outer_color = $green
    check_color = $accent
    check_text = Checking...
    fail_color = rgb(ff5555)
    font_color = $text
    fade_on_empty = false
    rounding = 0
    font_family = $font
    placeholder_text = Password
    fail_text = $FAIL
    dots_size = 0.35
    dots_spacing = 0.25
    position = 0, -85
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = $muted
    font_size = 16
    font_family = $font
    position = 0, -145
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>Session locked</b>
    color = $accent
    font_size = 36
    font_family = $font
    position = 0, 175
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] LC_TIME=C date +'%I:%M:%S %p'
    color = $text
    font_size = 48
    font_family = $font
    text_align = center
    position = 0, 75
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] LC_TIME=C date +'%A, %B %d, %Y'
    color = $text
    font_size = 22
    font_family = $font
    position = 0, -5
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTFAIL
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, -180
    halign = center
    valign = center
}
