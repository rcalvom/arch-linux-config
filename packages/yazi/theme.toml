# Matches ~/.config/nvim/lua/ricardo/colors.lua. Backgrounds are omitted where
# possible so Yazi inherits Alacritty's transparency.

[mgr]
cwd = { fg = "#f1f1f1", bold = true }
find_keyword = { fg = "#20a5ba", bold = true }
find_position = { fg = "#2c2c2c", bg = "#f3e430", bold = true }
symlink_target = { fg = "#818181" }
marker_copied = { fg = "#20a5ba", bold = true }
marker_cut = { fg = "#fb007a", bold = true }
marker_marked = { fg = "#f1f1f1", bg = "#2c2c2c" }
marker_selected = { fg = "#f1f1f1", bg = "#005f87", bold = true }
count_copied = { fg = "#2c2c2c", bg = "#20a5ba" }
count_cut = { fg = "#f1f1f1", bg = "#c30771" }
count_selected = { fg = "#f1f1f1", bg = "#005f87" }
border_symbol = "│"
border_style = { fg = "#005f87" }

[indicator]
parent = { fg = "#d6d6d6" }
current = { fg = "#f1f1f1", bg = "#005f87", bold = true }
preview = { fg = "#d6d6d6" }
padding = { open = " ", close = " " }

[tabs]
active = { fg = "#f1f1f1", bg = "#2c2c2c", bold = true }
inactive = { fg = "#818181" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#f1f1f1", bg = "#005f87", bold = true }
normal_alt = { fg = "#d6d6d6" }
select_main = { fg = "#2c2c2c", bg = "#f3e430", bold = true }
select_alt = { fg = "#d6d6d6" }
unset_main = { fg = "#f1f1f1", bg = "#6855de", bold = true }
unset_alt = { fg = "#d6d6d6" }

[status]
overall = { fg = "#d6d6d6" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#20a5ba" }
perm_read = { fg = "#10a778" }
perm_write = { fg = "#f3e430" }
perm_exec = { fg = "#20bbfc" }
perm_sep = { fg = "#818181" }
progress_label = { fg = "#f1f1f1", bold = true }
progress_normal = { fg = "#20bbfc", bg = "#2c2c2c" }
progress_error = { fg = "#fb007a", bg = "#2c2c2c" }

[which]
cols = 2
mask = { bg = "#212121" }
cand = { fg = "#20bbfc", bold = true }
rest = { fg = "#f1f1f1" }
desc = { fg = "#d6d6d6" }
separator = " -> "
separator_style = { fg = "#818181" }

[confirm]
border = { fg = "#005f87" }
title = { fg = "#f1f1f1", bold = true }
body = { fg = "#d6d6d6" }
list = { fg = "#f1f1f1" }
btn_yes = { fg = "#2c2c2c", bg = "#10a778", bold = true }
btn_no = { fg = "#f1f1f1", bg = "#c30771" }
btn_labels = [" Yes ", " No "]

[spot]
border = { fg = "#005f87" }
title = { fg = "#f1f1f1", bold = true }
tbl_col = { fg = "#f1f1f1", bg = "#2c2c2c" }
tbl_cell = { fg = "#f1f1f1", bg = "#005f87" }

[notify]
title_info = { fg = "#20bbfc", bold = true }
title_warn = { fg = "#f3e430", bold = true }
title_error = { fg = "#fb007a", bold = true }

[pick]
border = { fg = "#005f87" }
active = { fg = "#f1f1f1", bg = "#005f87", bold = true }
inactive = { fg = "#d6d6d6" }

[input]
border = { fg = "#005f87" }
title = { fg = "#f1f1f1", bold = true }
value = { fg = "#f1f1f1" }
selected = { fg = "#2c2c2c", bg = "#20bbfc" }

[cmp]
border = { fg = "#005f87" }
active = { fg = "#f1f1f1", bg = "#005f87", bold = true }
inactive = { fg = "#d6d6d6" }
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#005f87" }
title = { fg = "#f1f1f1", bold = true }
hovered = { fg = "#f1f1f1", bg = "#005f87" }

[help]
on = { fg = "#20bbfc", bold = true }
run = { fg = "#f1f1f1" }
desc = { fg = "#d6d6d6" }
hovered = { fg = "#f1f1f1", bg = "#005f87" }
footer = { fg = "#818181" }
icon_info = ""
icon_warn = ""
icon_error = ""

[filetype]
rules = [
  { mime = "image/*", fg = "#f3e430" },
  { mime = "{audio,video}/*", fg = "#20a5ba" },
  { mime = "application/pdf", fg = "#fb007a" },
  { mime = "inode/empty", fg = "#818181" },
  { url = "*", is = "orphan", fg = "#fb007a" },
  { url = "*/", fg = "#20bbfc", bold = true },
]
